name: Build and Release

on:
  push:
    branches: [master]
    tags: ['*']
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: nuget/setup-nuget@v2

      - name: Restore NuGet packages
        run: nuget restore SGDBMetadata.sln

      - name: Build Release
        run: msbuild SGDBMetadata.sln /p:Configuration=Release /p:Platform="Any CPU"

      - name: Setup Playnite
        run: |
          Invoke-WebRequest -Uri "https://github.com/JosefNemec/Playnite/releases/download/10.56/10.56.7z" -OutFile "$env:GITHUB_WORKSPACE\Playnite.7z"
          & "$env:ProgramFiles\7-Zip\7z.exe" x "$env:GITHUB_WORKSPACE\Playnite.7z" "-o$env:GITHUB_WORKSPACE\Playnite"

      - name: Pack with Playnite
        run: |
          $playniteDlls = Get-ChildItem "$env:GITHUB_WORKSPACE\Playnite" -Filter *.dll -Name
          $buildDir = "$env:GITHUB_WORKSPACE\SGDBMetadata\bin\Release"
          Remove-Item "$buildDir\*" -Include $playniteDlls -ErrorAction SilentlyContinue
          & "$env:GITHUB_WORKSPACE\Playnite\Toolbox.exe" pack $buildDir "$env:GITHUB_WORKSPACE"
          Move-Item -Path "$env:GITHUB_WORKSPACE\*.pext" -Destination "SteamGridDB_Playnite_Metadata_${{ github.ref_name }}.pext"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SteamGridDB_Playnite_Metadata_${{ github.ref_name }}.pext
          path: SteamGridDB_Playnite_Metadata_${{ github.ref_name }}.pext

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: SteamGridDB_Playnite_Metadata_${{ github.ref_name }}.pext